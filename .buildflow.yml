# go.mod's `go 1.26.7` patch floor is documented policy (AGENTS.md: matches the
# CI matrix and the encoding/json/v2 GOEXPERIMENT toolchain). Two pipeline
# tools fight it, verified by strace attribution on 2026-10-07:
#   - go-version-auto-configure wants a major.minor-only directive.
#   - go-mod-update minor mode bumps the directive to the latest Go release;
#     patch mode fails outright on this module graph. Run `buildflow update`
#     explicitly instead.
# go-structure-linter UNSKIPPED 2026-10-09 (SUPERB plan A5): its go-version
# repair is detect-only in v0.11.3 (it no longer bumps the directive) and
# root-package-files auto-defers for this flat single-package layout.
skip_steps:
  - go-version-auto-configure
  - go-mod-update
