name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

permissions:
  contents: read

env:
  GOEXPERIMENT: jsonv2
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  go-directive:
    name: Go Directive Floor
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 from 2026-10-19 (runner-images#14748)
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assert go.mod directive is pinned to the CI floor
        run: |
          expected="go 1.26.7"
          actual=$(grep -E '^go [0-9]+(\.[0-9]+){0,2}$' go.mod | head -1)
          if [ "$actual" != "$expected" ]; then
            echo "::error::go.mod go-directive drifted."
            echo "::error::expected: '$expected'"
            echo "::error::found:    '$actual'"
            echo "Three incidents (2026-09-29, 2026-10-07 x2) came from silent bumps of this line."
            echo "Restore go.mod, or bump it deliberately in BOTH go.mod and this guard (.github/workflows/ci.yml + flake.nix go-directive check)."
            exit 1
          fi
          echo "go-directive OK: $actual"

  test:
    name: Test (${{ matrix.go-version }}, ${{ matrix.os }})
    needs: go-directive
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false # probe legs must all complete to expose the full failure set
      matrix:
        # No go 1.27 leg: encoding/json/v2 (used in event.go) requires the
        # go directive >= 1.27 under the Go 1.27 toolchain, which is
        # structurally incompatible with the pinned 1.26.7 floor. Add the
        # leg back when the floor intentionally moves to 1.27.
        go-version: ["1.26"]
        # ubuntu-26.04 is proven here BEFORE ubuntu-latest migrates to it
        # (rollout starts 2026-10-19, completes 2026-11-19). Keep 24.04 until
        # GitHub announces its deprecation brownouts. windows/macos legs are
        # PROBE legs (informational): triage platform-specific test failures
        # before making them required.
        os: [ubuntu-24.04, ubuntu-26.04, macos-15, windows-2025]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: ${{ matrix.go-version }}
      - run: go build ./...
      - run: go test -race -count=1 ./...
      - run: go test -count=1 -coverprofile=coverage.out .
      - run: go tool cover -func=coverage.out
      - name: Enforce coverage threshold
        shell: bash
        run: |
          COVERAGE=$(go tool cover -func=coverage.out | tail -1 | awk '{print $3}' | sed 's/%//')
          echo "Library coverage: ${COVERAGE}%"
          # awk comparison instead of bc: no bc on Windows runners
          if awk -v c="$COVERAGE" 'BEGIN { exit !(c < 85) }'; then
            echo "::error::Coverage ${COVERAGE}% is below 85% threshold"
            exit 1
          fi

  examples-build:
    name: Examples Build
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 from 2026-10-19 (runner-images#14748)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      # Verify all examples/ subdirectories build without errors.
      # Examples are runnable programs, so we run `go build` (not `go test`).
      - name: Build all examples
        run: go build ./examples/...

  lint:
    name: Lint
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 from 2026-10-19 (runner-images#14748)
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - run: go vet ./...
      - uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9.3.0
        with:
          version: v2.14.0
      - name: Check formatting
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Files need formatting:"
            echo "$unformatted"
            exit 1
          fi

  benchmark:
    name: Benchmark
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 from 2026-10-19 (runner-images#14748)
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Run benchmarks
        run: go test -bench=. -benchmem -count=1 -race ./...
      - name: Save benchmark results
        if: github.event_name == 'push'
        run: |
          mkdir -p bench-results
          go test -bench=. -benchmem -count=1 -run=^$ ./... > bench-results/bench.txt 2>&1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: github.event_name == 'push'
        with:
          name: benchmark-results
          path: bench-results/bench.txt

  benchmark-compare:
    name: Benchmark Regression Check
    runs-on: ubuntu-24.04  # pinned: ubuntu-latest migrates to 26.04 from 2026-10-19 (runner-images#14748)
    timeout-minutes: 15
    # Only run on PRs against master/main; compares current benchmarks
    # to baseline. Skips if benchstat is not installed.
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: "1.26"
      - name: Install benchstat
        run: go install golang.org/x/perf/cmd/benchstat@latest
      - name: Run current benchmarks
        run: |
          go test -bench=. -benchmem -count=3 -run=^$ -benchtime=1s ./... > new.txt 2>&1
      - name: Note on regression detection
        run: |
          echo "Benchmark regression detection is informational only."
          echo "Compare new.txt against known baselines manually using benchstat."
          echo "Future: store baseline in repo and fail CI on >20% regression."
          cat new.txt | head -30
