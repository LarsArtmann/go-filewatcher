name: Docs Consistency

on:
  pull_request:
    branches: [master, main]
  push:
    branches: [master, main]

permissions:
  contents: read

jobs:
  check-deprecation-consistency:
    name: README vs API_STABILITY Drift Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify deprecated symbols are consistent
        run: |
          set -euo pipefail

          FAIL=0

          # --- Extract deprecated symbols from API_STABILITY.md ---
          # Lines like: | Options | `WithOnError` | **Deprecated** | ...
          # We extract the backtick-quoted symbol name from deprecated rows.
          DEPRECATED_SYMBOLS=$(grep -oP '`[A-Za-z]+`.*\*\*Deprecated\*\*' API_STABILITY.md \
            | grep -oP '`\K[A-Za-z]+' || true)

          if [ -z "$DEPRECATED_SYMBOLS" ]; then
            echo "No deprecated symbols found in API_STABILITY.md."
            echo "If this is unexpected, check the Deprecated APIs table format."
          fi

          for symbol in $DEPRECATED_SYMBOLS; do
            echo "Checking deprecated symbol: $symbol"

            # 1. If README.md mentions the symbol, it must be marked deprecated.
            #    (If it's not in README at all, that's not a contradiction —
            #    just undocumented.)
            if grep -q "$symbol" README.md; then
              if ! grep -qi "deprecated" README.md; then
                echo "::error::README.md mentions $symbol but has no 'deprecated' callout."
                echo "::error::$symbol is deprecated in API_STABILITY.md."
                FAIL=1
              fi
            fi

            # 2. API_STABILITY.md must NOT list it as Stable.
            # Check the Stable APIs table — grep for the symbol in a Stable row.
            if grep -P "\|\s*\`$symbol\`.*\*\*Stable\*\*" API_STABILITY.md >/dev/null 2>&1; then
              echo "::error::$symbol is listed as both Stable AND Deprecated in API_STABILITY.md"
              FAIL=1
            fi
          done

          # --- Check README deprecated symbols exist in API_STABILITY.md ---
          # Find symbols in README marked with ⚠️ (deprecated marker).
          README_DEPRECATED=$(grep -oP '`\K[A-Za-z]+(?=`.*⚠️)' README.md || true)

          for symbol in $README_DEPRECATED; do
            if ! grep -q "$symbol" API_STABILITY.md; then
              echo "::error::$symbol is marked deprecated in README.md but missing from API_STABILITY.md"
              FAIL=1
            fi
          done

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "::error::Deprecation claims are inconsistent between README.md and API_STABILITY.md."
            echo "::error::Fix the drift so both files agree on which symbols are deprecated."
            exit 1
          fi

          echo "README.md and API_STABILITY.md deprecation claims are consistent."

  check-exported-symbol-docs:
    name: Exported Symbols in Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Verify every exported symbol is mentioned in FEATURES.md or README.md
        run: |
          set -euo pipefail

          # Symbols exempt from the docs check.
          #
          # 1. Compile-time phantom-type helpers (not user-facing):
          #    LogSubstring, NewLogSubstring, TempDir, NewTempDir,
          #    OpString, NewOpString, DebounceKey, NewDebounceKey,
          #    NewEventPath, NewRootPath, NewWatcherError
          #
          # 2. Deprecated (mentioned via migration path, not in feature table):
          #    WithWatchedIgnoreDirs
          #
          # 3. Remaining undocumented gaps — remove as they get documented:
          #    FilterGeneratedCodeFull, FilterGeneratedCodeWithFilter
          EXEMPT_SYMBOLS="LogSubstring NewLogSubstring TempDir NewTempDir OpString NewOpString DebounceKey NewDebounceKey \
            FilterGeneratedCodeFull FilterGeneratedCodeWithFilter WatcherStateFlags \
            WithWatchedIgnoreDirs NewEventPath NewRootPath NewWatcherError"

          # Extract top-level exported symbols (skip methods and unexported).
          SYMBOLS=$(go doc -all . 2>/dev/null \
            | grep -E '^(func|type|var|const) [A-Z]' \
            | grep -vE '^func \(' \
            | sed -E 's/^func ([A-Za-z]+).*/\1/' \
            | sed -E 's/^type ([A-Za-z]+).*/\1/' \
            | sed -E 's/^var ([A-Za-z]+).*/\1/' \
            | sed -E 's/^const ([A-Za-z]+).*/\1/' \
            | sort -u)

          if [ -z "$SYMBOLS" ]; then
            echo "::error::No exported symbols found. Is go doc working?"
            exit 1
          fi

          FAIL=0

          for symbol in $SYMBOLS; do
            # Skip exempt symbols.
            if echo "$EXEMPT_SYMBOLS" | grep -qw "$symbol"; then
              continue
            fi

            # Check if the symbol appears in FEATURES.md or README.md.
            if ! grep -q "$symbol" FEATURES.md README.md; then
              echo "::warning file=FEATURES.md::Exported symbol '$symbol' is not mentioned in FEATURES.md or README.md"
              FAIL=1
            fi
          done

          if [ $FAIL -ne 0 ]; then
            echo ""
            echo "::error::Some exported symbols are missing from FEATURES.md and README.md."
            echo "::error::If the symbol is an internal helper, add it to EXEMPT_SYMBOLS in this workflow."
            echo "::error::Otherwise, document it in FEATURES.md (feature table) or README.md (usage)."
            exit 1
          fi

          echo "All non-exempt exported symbols are documented in FEATURES.md or README.md."
