# go.mod's `go 1.26.7` patch floor is documented policy (AGENTS.md: matches the
# encoding/json/v2 toolchain requirement and the CI matrix). go-version-auto-
# configure wants a major.minor-only directive and fights go-mod-update, which
# flip-flopped the line 3 times in 20 commits. Skip until dispositions align.
skip_steps:
  - go-version-auto-configure
  # go-mod-update minor mode bumps the go directive to the latest Go release
  # (1.27), breaking the CI matrix floor and the vendorHash FOD; patch mode
  # fails outright ("can't query version patch ... no existing version is
  # required"). Run dependency updates explicitly via `buildflow update`.
  - go-mod-update
